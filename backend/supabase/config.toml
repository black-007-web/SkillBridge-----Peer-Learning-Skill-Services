project_id = "skillbridge-mobile"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "skillbridge://auth-callback",
  "skillbridge://reset-password"
]

[auth.email]
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.email.template.confirmation]
subject = "Your SkillBridge registration code"
content_path = "./supabase/templates/auth_confirmation.html"

[auth.email.template.recovery]
subject = "Reset your SkillBridge password"
content_path = "./supabase/templates/password_recovery.html"

[functions.welcome-email]
verify_jwt = false

[functions.delete-account]
verify_jwt = true

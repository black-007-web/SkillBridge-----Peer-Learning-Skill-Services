<!doctype html>
<html>
  <body style="margin:0;background:#080b16;color:#f0f3ff;font-family:Arial,sans-serif;padding:32px 16px">
    <main style="max-width:600px;margin:auto;background:#12182b;border:1px solid #29344f;border-radius:22px;padding:36px">
      <p style="letter-spacing:2px;color:#8fa2ff;font-weight:bold">SKILLBRIDGE</p>
      <h1>Confirm your email</h1>
      <p style="line-height:1.7;color:#c0c9df">Enter this one-time code in SkillBridge to confirm your email address and activate your account.</p>
      <p style="margin:28px 0;padding:18px;background:#080b16;border-radius:12px;text-align:center;color:#a9b8ff;font-size:30px;font-weight:bold;letter-spacing:8px">{{ .Token }}</p>
      <p style="color:#abb5cf">This code expires. Request a new code in the app if it does.</p>
      <p style="color:#abb5cf">If you did not create a SkillBridge account, you can ignore this email.</p>
    </main>
  </body>
</html>

<!doctype html>
<html>
  <body style="margin:0;background:#080b16;color:#f0f3ff;font-family:Arial,sans-serif;padding:32px 16px">
    <main style="max-width:600px;margin:auto;background:#12182b;border:1px solid #29344f;border-radius:22px;padding:36px">
      <p style="letter-spacing:2px;color:#8fa2ff;font-weight:bold">SKILLBRIDGE</p>
      <h1>Reset your password</h1>
      <p style="line-height:1.7;color:#c0c9df">Use the secure link below to choose a new password. The link expires and can only be used once.</p>
      <p style="margin:28px 0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#8298ff;color:#10162d;text-decoration:none;font-weight:bold;padding:13px 20px;border-radius:12px">Reset password</a></p>
      <p style="color:#abb5cf">If you did not request this change, ignore this email and keep your password safe.</p>
    </main>
  </body>
</html>
